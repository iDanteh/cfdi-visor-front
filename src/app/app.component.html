<ng-container *ngIf="auth.isAuthenticated; else noLayout">
  <div class="app-layout">

    <nav class="sidebar" [class.sidebar-collapsed]="sidebarCollapsed">

      <!-- Brand + toggle -->
      <div class="sidebar-brand">
        <div *ngIf="!sidebarCollapsed" class="sidebar-brand-name">CFDI Comparator</div>
        <div *ngIf="!sidebarCollapsed" class="sidebar-brand-sub">Sistema contable</div>
        <button (click)="toggleSidebar()" class="sidebar-toggle" [title]="sidebarCollapsed ? 'Expandir' : 'Colapsar'">
          {{ sidebarCollapsed ? '›' : '‹' }}
        </button>
      </div>

      <!-- Navigation -->
      <div class="sidebar-nav">
        <div *ngIf="!sidebarCollapsed" class="sidebar-section">Principal</div>
        <a routerLink="/banks" routerLinkActive="active" [title]="sidebarCollapsed ? 'Bancos' : ''">
          <span class="sidebar-icon">₿</span>
          <span *ngIf="!sidebarCollapsed">Bancos</span>
        </a>
        <a routerLink="/collection-requests" routerLinkActive="active" [title]="sidebarCollapsed ? 'Solicitudes de Cobro' : ''">
          <span class="sidebar-icon">📷</span>
          <span *ngIf="!sidebarCollapsed">Solicitudes de Cobro</span>
        </a>

        <div *ngIf="!sidebarCollapsed" class="sidebar-section">Contabilidad</div>
        <a routerLink="/account-plan" routerLinkActive="active" [title]="sidebarCollapsed ? 'Catálogo de Cuentas' : ''">
          <span class="sidebar-icon">📒</span>
          <span *ngIf="!sidebarCollapsed">Catálogo de Cuentas</span>
        </a>

        <div *ngIf="!sidebarCollapsed" class="sidebar-section">Experimental</div>
        <a routerLink="/erp-matches" routerLinkActive="active" [title]="sidebarCollapsed ? 'CxC vs Bancos' : ''">
          <span class="sidebar-icon">🔬</span>
          <span *ngIf="!sidebarCollapsed">CxC vs Bancos</span>
        </a>
      </div>

      <!-- Footer -->
      <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
        <div class="sidebar-user">
          <div class="sidebar-avatar">{{ auth.currentUser.name[0].toUpperCase() }}</div>
          <div>
            <div class="sidebar-user-name">{{ auth.currentUser.name }}</div>
            <div class="sidebar-user-role">{{ auth.currentUser.role }}</div>
          </div>
        </div>
        <button (click)="logout()" class="btn btn-ghost btn-sm w-full"
          style="justify-content:center; color:#94a3b8; border:1px solid rgba(255,255,255,0.08);">
          Cerrar sesión
        </button>
      </div>

      <div class="sidebar-footer" *ngIf="sidebarCollapsed" style="padding:0.75rem 0; display:flex; justify-content:center;">
        <button (click)="logout()" class="sidebar-toggle" title="Cerrar sesión" style="font-size:1rem;">⏻</button>
      </div>

    </nav>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</ng-container>

<ng-template #noLayout>
  <router-outlet></router-outlet>
</ng-template>
